# Keeps uv.lock fresh so the committed lock (and the Community Cloud demo, which
# deploys from it) tracks current Streamlit and its dependencies. All updates are
# batched into one daily PR to keep the noise down for a template repo.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Streamlit minor/major releases have changed page layout internals before
    # (e.g. 1.66 replaced the sidebar's aria-expanded). Upgrade those by hand
    # after checking the site; security/patch releases still come through.
    ignore:
      - dependency-name: "streamlit"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
